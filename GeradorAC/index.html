<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador AC</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: white;
            font-family: Arial, sans-serif;
            width: 100%;
            overflow-x: hidden;
        }

        canvas {
            display: block;
            width: min(1200px, calc(100vw - 20px));
            height: auto;
            aspect-ratio: 1200 / 550;
            margin: 20px auto;
            border: 1px solid #ccc;
        }

        #controls {
            width: min(900px, calc(100vw - 20px));
            margin: 10px auto 30px auto;
        }

        .titulo-controles {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .control {
            display: flex;
            align-items: center;
            margin: 8px 0;
            gap: 10px;
        }

        .control label {
            width: 180px;
            flex-shrink: 0;
        }

        .control input[type="range"] {
            flex: 1;
        }

        .control span {
            width: 70px;
            text-align: right;
        }
    </style>
</head>

<body>

    <canvas id="geradorCanvas" width="1200" height="550"></canvas>

    <div id="controls">

        <div class="titulo-controles">
            Parâmetros do gerador
        </div>

        <div class="control">
            <label for="slider_N">N</label>
            <input
                id="slider_N"
                type="range"
                min="1"
                max="500"
                step="1"
                value="100"
            >
            <span id="valor_N">100</span>
        </div>

        <div class="control">
            <label for="slider_A">A</label>
            <input
                id="slider_A"
                type="range"
                min="0.1"
                max="5"
                step="0.1"
                value="2"
            >
            <span id="valor_A">2</span>
        </div>

        <div class="control">
            <label for="slider_B">B</label>
            <input
                id="slider_B"
                type="range"
                min="-2"
                max="2"
                step="0.1"
                value="0.5"
            >
            <span id="valor_B">0.5</span>
        </div>

        <div class="control">
            <label for="slider_w">ω (rad/s)</label>
            <input
                id="slider_w"
                type="range"
                min="0"
                max="20"
                step="0.1"
                value="10"
            >
            <span id="valor_w">10</span>
        </div>

        <div class="control">
            <label for="slider_R">R (Ω)</label>
            <input
                id="slider_R"
                type="range"
                min="1"
                max="100"
                step="1"
                value="10"
            >
            <span id="valor_R">10</span>
        </div>

    </div>

    <script src="GeradorAC.js"></script>

</body>

</html>
