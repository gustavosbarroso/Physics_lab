```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Capacitor Cilíndrico
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 0;

            background: white;

            font-family:
                Arial,
                sans-serif;
        }


        /* =====================================================
           CANVAS
           ===================================================== */

        canvas {

            display: block;

            margin: 20px auto;

            border:
                1px solid #ccc;

            background:
                white;

            max-width: 100%;
        }


        /* =====================================================
           CONTROLES
           ===================================================== */

        .capacitor-cilindrico-controls {

            width: 900px;

            max-width: calc(100% - 40px);

            margin: 20px auto 30px;

            padding: 0;
        }


        .capacitor-cilindrico-controls h2 {

            margin-top: 10px;

            margin-bottom: 20px;

            font-size: 22px;

            color: #222;
        }


        /* =====================================================
           CADA CONTROLE
           ===================================================== */

        .control {

            margin-bottom: 14px;
        }


        .control label {

            display: flex;

            align-items: center;

            gap: 10px;

            font-size: 15px;

            color: #333;
        }


        /* =====================================================
           SLIDERS
           ===================================================== */

        .control input[type="range"] {

            width: 300px;

            cursor: pointer;
        }


        /* =====================================================
           VALOR DO SLIDER
           ===================================================== */

        .control span {

            display: inline-block;

            min-width: 55px;

            font-weight: bold;

            color: #222;
        }


        /* =====================================================
           RESPONSIVIDADE
           ===================================================== */

        @media (max-width: 700px) {

            canvas {

                width: 100%;

                height: auto;

                margin: 10px auto;
            }


            .capacitor-cilindrico-controls {

                max-width:
                    calc(100% - 20px);
            }


            .control label {

                flex-wrap: wrap;
            }


            .control input[type="range"] {

                width: 100%;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         CANVAS DA SIMULAÇÃO
         ===================================================== -->

    <canvas
        id="canvas"
        width="1000"
        height="650">
    </canvas>


    <!-- =====================================================
         CLASSE DA SIMULAÇÃO
         ===================================================== -->

    <script src="CapacitorCilindrico.js"></script>


    <!-- =====================================================
         INICIALIZAÇÃO
         ===================================================== -->

    <script>

        const canvas =
            document.getElementById(
                "canvas"
            );


        const capacitor =
            new CapacitorCilindrico(

                canvas,

                {

                    // =========================================
                    // DENSIDADE LINEAR DE CARGA
                    // =========================================

                    lambda: 1.0,


                    // =========================================
                    // RAIO INTERNO
                    // =========================================

                    a: 1.0,


                    // =========================================
                    // RAIO EXTERNO
                    // =========================================

                    b: 2.0,


                    // =========================================
                    // COMPRIMENTO
                    // =========================================

                    L: 1.0

                }

            );

    </script>


</body>

</html>
