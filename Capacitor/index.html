<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Capacitor de Placas Paralelas</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 0;

            background: white;

            font-family:
                Arial,
                sans-serif;
        }


        canvas {

            display: block;

            margin: 20px auto;

            border:
                1px solid #ccc;

            background:
                white;
        }


        h2 {

            margin-top: 10px;

            margin-bottom: 15px;
        }


        .capacitor-controls {

            width: 900px;

            margin: 20px auto;

            font-family:
                Arial,
                sans-serif;
        }


        .control {

            margin-bottom: 12px;
        }


        .control label {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .control input[type="range"] {

            width: 300px;
        }


        .control select {

            padding: 3px 8px;

            font-size: 14px;
        }

    </style>

</head>


<body>


    <!-- =====================================================
         CANVAS
         ===================================================== -->

    <canvas
        id="canvas"
        width="900"
        height="600">
    </canvas>


    <!-- =====================================================
         CLASSE DO CAPACITOR
         ===================================================== -->

    <script src="Capacitor.js"></script>


    <!-- =====================================================
         INICIALIZAÇÃO
         ===================================================== -->

    <script>

        const canvas =
            document.getElementById(
                "canvas"
            );


        const capacitor =
            new Capacitor(

                canvas,

                {

                    // =========================================
                    // PLACA SUPERIOR
                    // =========================================

                    sign1: 1,


                    // =========================================
                    // PLACA INFERIOR
                    // =========================================

                    sign2: -1,


                    // =========================================
                    // DENSIDADE SUPERFICIAL
                    // =========================================

                    sigma: 1.0,


                    // =========================================
                    // ÁREA
                    // =========================================

                    area: 1.0,


                    // =========================================
                    // DISTÂNCIA
                    // =========================================

                    distance: 1.0

                }

            );

    </script>


</body>

</html>
