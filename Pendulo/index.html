<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simulador de Pêndulo</title>

    <style>

        body {
            margin: 0;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 1250px;
            margin: 25px auto;
            background: white;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        #canvas {
            width: 100%;
            height: auto;
            border: 1px solid #ccc;
            display: block;
        }

        #pendulo-controls {
            width: 100%;
            margin-top: 20px;
            padding: 10px 40px 20px 40px;
            box-sizing: border-box;
        }

        .slider-row {
            display: grid;
            grid-template-columns: 120px 1fr 80px;
            align-items: center;
            gap: 15px;
            margin: 12px 0;
        }

        .slider-label {
            font-size: 15px;
            text-align: right;
        }

        .pendulo-slider {
            width: 100%;
        }

        .slider-value {
            font-size: 15px;
            text-align: left;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Pêndulo Simples</h1>

    <canvas
        id="canvas"
        width="1250"
        height="650">
    </canvas>

</div>


<!-- =========================================================
     CÓDIGO DO PÊNDULO
     ========================================================= -->

<script src="./pendulo.js"></script>


<!-- =========================================================
     INICIALIZAÇÃO
     ========================================================= -->

<script>

    const canvas =
        document.getElementById("canvas");


    const pendulo =
        new Pendulo(
            canvas,
            {
                g: 9.81,
                L: 0.10,
                m: 1.0,
                b: 0.5,

                theta0: 1.0,
                omega0: 0.0
            }
        );

</script>


</body>

</html>
