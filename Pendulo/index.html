<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pêndulo Simples</title>

    <style>
        body {
            margin: 0;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 1250px;
            max-width: 95%;
            margin: 25px auto;
            background: white;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #ccc;
        }

        #controls {
            margin-top: 20px;
        }

        .control {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }

        .control label {
            width: 120px;
        }

        .control input {
            flex: 1;
        }

        .value {
            width: 90px;
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Pêndulo Simples</h1>

    <canvas
        id="canvas"
        width="1250"
        height="650">
    </canvas>

    <div id="controls"></div>

</div>

<script src="pendulo.js"></script>

<script>
    window.addEventListener("load", function () {

        const canvas = document.getElementById("canvas");

        new SimplePendulum(canvas);

    });
</script>

</body>
</html>
