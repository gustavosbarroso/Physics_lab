<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Simulador de Pêndulo</title>

    <style>

        body {
            margin: 0;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 1250px;
            margin: 25px auto;
            background: white;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        #canvas {
            width: 100%;
            height: auto;
            border: 1px solid #ccc;
            display: block;
        }

        #pendulum-controls {
            margin-top: 20px;
            padding: 10px 40px 20px 40px;
        }

        .control-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .control-label {
            width: 100px;
        }

        .control-slider {
            flex: 1;
        }

        .control-value {
            width: 70px;
            margin-left: 10px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Pêndulo Simples</h1>

    <canvas
        id="canvas"
        width="1250"
        height="650">
    </canvas>

    <div id="pendulum-controls"></div>

</div>


<script src="./pendulo.js"></script>

<script>

    const canvas =
        document.getElementById("canvas");

    const pendulo =
        new SimplePendulum(
            canvas,
            {
                g: 9.81,
                L: 1.0,
                m: 1.0,
                b: 0.05,
                theta0: 0.8,
                omega0: 0.0
            }
        );

</script>

</body>

</html>
