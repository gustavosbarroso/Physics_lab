<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>
        Tunelamento Quântico
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        canvas {
            border: 1px solid #aaa;
            background: white;
            display: block;
            margin-bottom: 20px;
        }

        .controle {
            margin: 8px 0;
        }

        .controle label {
            display: inline-block;
            width: 160px;
        }

        button {
            margin-top: 15px;
            margin-right: 10px;
            padding: 8px 18px;
            font-size: 15px;
            cursor: pointer;
        }

    </style>

</head>


<body>

    <h2>
        Tunelamento Quântico
    </h2>

    <canvas
        id="canvasTunelamento"
        width="1100"
        height="600">
    </canvas>


    <!-- ======================================================
         Controles
         ====================================================== -->

    <div class="controle">

        <label>
            V₀:
        </label>

        <input
            type="range"
            id="sliderV0"
            min="1"
            max="40"
            step="0.5"
            value="20">

        <span id="valorV0">
            20
        </span>

    </div>


    <div class="controle">

        <label>
            Largura da barreira a:
        </label>

        <input
            type="range"
            id="sliderA"
            min="0.1"
            max="2"
            step="0.05"
            value="0.5">

        <span id="valorA">
            0.50
        </span>

    </div>


    <div class="controle">

        <label>
            Posição inicial x₀:
        </label>

        <input
            type="range"
            id="sliderX0"
            min="-5"
            max="-1"
            step="0.1"
            value="-2.5">

        <span id="valorX0">
            -2.5
        </span>

    </div>


    <div class="controle">

        <label>
            Largura σ:
        </label>

        <input
            type="range"
            id="sliderSigma"
            min="0.2"
            max="1"
            step="0.05"
            value="0.4">

        <span id="valorSigma">
            0.40
        </span>

    </div>


    <div class="controle">

        <label>
            Número de onda k₀:
        </label>

        <input
            type="range"
            id="sliderK0"
            min="1"
            max="8"
            step="0.1"
            value="5">

        <span id="valorK0">
            5.0
        </span>

    </div>


    <!-- ======================================================
         Botões
         ====================================================== -->

    <button id="botaoPause">
        Pause
    </button>

    <button id="botaoReset">
        Reset
    </button>


    <!-- ======================================================
         JavaScript
         ====================================================== -->

    <script src="QuantumTunneling.js"></script>


    <script>

        // ------------------------------------------------------
        // Canvas
        // ------------------------------------------------------

        const canvas =
            document.getElementById(
                "canvasTunelamento"
            );


        // ------------------------------------------------------
        // Simulação
        // ------------------------------------------------------

        const simulacao =
            new QuantumTunneling(canvas);


        // ------------------------------------------------------
        // Sliders
        // ------------------------------------------------------

        const sliderV0 =
            document.getElementById("sliderV0");

        const sliderA =
            document.getElementById("sliderA");

        const sliderX0 =
            document.getElementById("sliderX0");

        const sliderSigma =
            document.getElementById("sliderSigma");

        const sliderK0 =
            document.getElementById("sliderK0");


        // ------------------------------------------------------
        // Valores
        // ------------------------------------------------------

        const valorV0 =
            document.getElementById("valorV0");

        const valorA =
            document.getElementById("valorA");

        const valorX0 =
            document.getElementById("valorX0");

        const valorSigma =
            document.getElementById("valorSigma");

        const valorK0 =
            document.getElementById("valorK0");


        // ------------------------------------------------------
        // Atualização dos parâmetros
        // ------------------------------------------------------

        function atualizarSimulacao() {

            const V0 =
                parseFloat(sliderV0.value);

            const a =
                parseFloat(sliderA.value);

            const x0 =
                parseFloat(sliderX0.value);

            const sigma =
                parseFloat(sliderSigma.value);

            const k0 =
                parseFloat(sliderK0.value);


            // Valores exibidos

            valorV0.textContent =
                V0.toFixed(1);

            valorA.textContent =
                a.toFixed(2);

            valorX0.textContent =
                x0.toFixed(1);

            valorSigma.textContent =
                sigma.toFixed(2);

            valorK0.textContent =
                k0.toFixed(1);


            // Atualiza a simulação

            simulacao.atualizarParametros({

                V0: V0,
                a: a,
                x0: x0,
                sigma: sigma,
                k0: k0

            });
        }


        // ------------------------------------------------------
        // Eventos dos sliders
        // ------------------------------------------------------

        sliderV0.addEventListener(
            "input",
            atualizarSimulacao
        );

        sliderA.addEventListener(
            "input",
            atualizarSimulacao
        );

        sliderX0.addEventListener(
            "input",
            atualizarSimulacao
        );

        sliderSigma.addEventListener(
            "input",
            atualizarSimulacao
        );

        sliderK0.addEventListener(
            "input",
            atualizarSimulacao
        );


        // ------------------------------------------------------
        // Pause / Play
        // ------------------------------------------------------

        const botaoPause =
            document.getElementById(
                "botaoPause"
            );


        botaoPause.addEventListener(
            "click",
            () => {

                simulacao.alternar();

                if (simulacao.running) {

                    botaoPause.textContent =
                        "Pause";

                } else {

                    botaoPause.textContent =
                        "Play";
                }

            }
        );


        // ------------------------------------------------------
        // Reset
        // ------------------------------------------------------

        const botaoReset =
            document.getElementById(
                "botaoReset"
            );


        botaoReset.addEventListener(
            "click",
            () => {

                sliderV0.value = 20;
                sliderA.value = 0.5;
                sliderX0.value = -2.5;
                sliderSigma.value = 0.4;
                sliderK0.value = 5.0;

                atualizarSimulacao();

                botaoPause.textContent =
                    "Play";
            }
        );


        // ------------------------------------------------------
        // Inicia
        // ------------------------------------------------------

        atualizarSimulacao();

        simulacao.iniciar();

    </script>

</body>

</html>
