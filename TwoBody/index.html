<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Problema de Dois Corpos</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #111;

            color: white;

            display: flex;

            justify-content: center;
        }

        .container {

            width: 1100px;

            max-width: 95vw;

            padding: 25px;
        }

        h1 {

            text-align: center;

            margin-bottom: 20px;
        }

        .main {

            display: grid;

            grid-template-columns:
                1fr 300px;

            gap: 20px;

            align-items: start;
        }

        .simulation {

            background: #181818;

            border-radius: 10px;

            padding: 10px;
        }

        canvas {

            width: 100%;

            height: auto;

            display: block;

            background: #101010;

            border-radius: 6px;
        }

        .controls {

            background: #181818;

            border-radius: 10px;

            padding: 20px;
        }

        .control {

            margin-bottom: 20px;
        }

        .control label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;
        }

        .value {

            float: right;

            font-weight: bold;
        }

        input[type="range"] {

            width: 100%;
        }

        .buttons {

            display: flex;

            gap: 10px;

            margin-top: 20px;
        }

        button {

            flex: 1;

            padding: 10px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;
        }

        button:hover {

            opacity: 0.85;
        }

        .info {

            margin-top: 20px;

            padding: 15px;

            background: #101010;

            border-radius: 6px;

            line-height: 1.6;

            font-size: 14px;
        }

        @media (max-width: 850px) {

            .main {

                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Problema de Dois Corpos</h1>

    <div class="main">

        <!-- ========================================= -->
        <!-- SIMULAÇÃO -->
        <!-- ========================================= -->

        <div class="simulation">

            <canvas
                id="twoBodyCanvas"
                width="700"
                height="600">
            </canvas>

        </div>


        <!-- ========================================= -->
        <!-- CONTROLES -->
        <!-- ========================================= -->

        <div class="controls">

            <h2>Parâmetros</h2>


            <!-- MASSA 1 -->

            <div class="control">

                <label>

                    M₁ (M☉)

                    <span
                        class="value"
                        id="m1Value">
                        1.00
                    </span>

                </label>

                <input
                    id="m1Slider"
                    type="range"
                    min="0.1"
                    max="5"
                    step="0.1"
                    value="1"
                >

            </div>


            <!-- MASSA 2 -->

            <div class="control">

                <label>

                    M₂ (M☉)

                    <span
                        class="value"
                        id="m2Value">
                        1.00
                    </span>

                </label>

                <input
                    id="m2Slider"
                    type="range"
                    min="0.1"
                    max="5"
                    step="0.1"
                    value="1"
                >

            </div>


            <!-- EXCENTRICIDADE -->

            <div class="control">

                <label>

                    Excentricidade (e)

                    <span
                        class="value"
                        id="eValue">
                        0.50
                    </span>

                </label>

                <input
                    id="eSlider"
                    type="range"
                    min="0"
                    max="0.95"
                    step="0.01"
                    value="0.50"
                >

            </div>


            <!-- BOTÕES -->

            <div class="buttons">

                <button id="pauseButton">
                    Pausar
                </button>

                <button id="resetButton">
                    Reiniciar
                </button>

            </div>


            <!-- ===================================== -->
            <!-- INFORMAÇÕES -->
            <!-- ===================================== -->

            <div class="info">

                <strong>Informações</strong>

                <p>
                    Sistema em relação ao
                    centro de massa.
                </p>

                <p id="orbitInfo">
                    Órbita: —
                </p>

                <p id="periodInfo">
                    Período: —
                </p>

                <p id="distanceInfo">
                    Distâncias: —
                </p>

            </div>

        </div>

    </div>

</div>


<script src="TwoBody.js"></script>


<script>

    // =====================================================
    // CANVAS
    // =====================================================

    const canvas =
        document.getElementById(
            "twoBodyCanvas"
        );


    // =====================================================
    // SISTEMA
    // =====================================================

    const system =
        new TwoBodySystem(
            canvas,
            {

                m1: 1.0,

                m2: 1.0,

                e: 0.50,

                a: 2.0,

                periods: 2.0

            }
        );


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const m1Slider =
        document.getElementById(
            "m1Slider"
        );

    const m2Slider =
        document.getElementById(
            "m2Slider"
        );

    const eSlider =
        document.getElementById(
            "eSlider"
        );


    const m1Value =
        document.getElementById(
            "m1Value"
        );

    const m2Value =
        document.getElementById(
            "m2Value"
        );

    const eValue =
        document.getElementById(
            "eValue"
        );


    const orbitInfo =
        document.getElementById(
            "orbitInfo"
        );

    const periodInfo =
        document.getElementById(
            "periodInfo"
        );

    const distanceInfo =
        document.getElementById(
            "distanceInfo"
        );


    // =====================================================
    // ATUALIZA VALORES
    // =====================================================

    function updateLabels() {

        m1Value.textContent =
            Number(
                m1Slider.value
            ).toFixed(2);

        m2Value.textContent =
            Number(
                m2Slider.value
            ).toFixed(2);

        eValue.textContent =
            Number(
                eSlider.value
            ).toFixed(2);
    }


    // =====================================================
    // ATUALIZA SISTEMA
    // =====================================================

    function updateSystem() {

        const params = {

            m1:
                Number(
                    m1Slider.value
                ),

            m2:
                Number(
                    m2Slider.value
                ),

            e:
                Number(
                    eSlider.value
                )

        };


        system.setParameters(
            params
        );


        const info =
            system.getOrbitInfo();


        // -------------------------------------------------
        // TIPO DE ÓRBITA
        // -------------------------------------------------

        orbitInfo.textContent =
            `Órbita: ${info.tipo}`;


        // -------------------------------------------------
        // PERÍODO
        // -------------------------------------------------

        periodInfo.textContent =
            `Período: ${info.TKepler.toFixed(2)} anos`;


        // -------------------------------------------------
        // DISTÂNCIAS
        // -------------------------------------------------

        distanceInfo.textContent =
            `rₚ = ${info.rp.toFixed(2)} UA | ` +
            `rₐ = ${info.ra.toFixed(2)} UA`;
    }


    // =====================================================
    // SLIDERS
    // =====================================================

    [

        m1Slider,

        m2Slider,

        eSlider

    ].forEach(
        slider => {

            slider.addEventListener(
                "input",
                () => {

                    updateLabels();

                    updateSystem();

                }
            );

        }
    );


    // =====================================================
    // PAUSE
    // =====================================================

    const pauseButton =
        document.getElementById(
            "pauseButton"
        );


    pauseButton.addEventListener(
        "click",
        () => {

            if (
                system.running
            ) {

                system.pause();

                pauseButton.textContent =
                    "Continuar";

            } else {

                system.start();

                pauseButton.textContent =
                    "Pausar";
            }

        }
    );


    // =====================================================
    // RESET
    // =====================================================

    const resetButton =
        document.getElementById(
            "resetButton"
        );


    resetButton.addEventListener(
        "click",
        () => {

            updateLabels();

            updateSystem();

            pauseButton.textContent =
                "Pausar";

        }
    );


    // =====================================================
    // INICIALIZAÇÃO
    // =====================================================

    updateLabels();

    updateSystem();

    system.animate();

</script>

</body>

</html>
