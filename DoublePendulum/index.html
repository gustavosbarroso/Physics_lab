<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pêndulo Duplo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: white;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 1200px;
            height: 550px;
            margin: 20px auto;
            border: 1px solid #ccc;
            background: white;
        }

        #double-pendulum-controls {
            width: 900px;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-top: 10px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <canvas
        id="doublePendulumCanvas"
        width="1200"
        height="550">
    </canvas>

    <script src="DoublePendulum.js"></script>

    <script>

        const canvas =
            document.getElementById(
                "doublePendulumCanvas"
            );

        const pendulum =
            new DoublePendulum(
                canvas,
                {
                    g: 9.81,

                    L1: 1.0,
                    L2: 1.0,

                    m1: 1.0,
                    m2: 1.0,

                    theta10: 0.8,
                    omega10: 0.0,

                    theta20: 1.2,
                    omega20: 0.0
                }
            );

    </script>

</body>

</html>
