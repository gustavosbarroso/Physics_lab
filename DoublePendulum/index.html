<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pêndulo Duplo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            padding: 30px 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        /* =====================================================
           CONTAINER
           ===================================================== */

        .simulation-container {

            width: min(
                1200px,
                calc(100vw - 40px)
            );

            margin: 0 auto;

            background: white;

            padding: 20px;

            border-radius: 8px;
        }

        /* =====================================================
           CANVAS
           ===================================================== */

        #doublePendulumCanvas {

            display: block;

            width: 100%;
            height: auto;

            aspect-ratio: 1200 / 550;

            margin: 0 auto;

            border: 1px solid #ddd;
        }

        /* =====================================================
           CONTROLES
           ===================================================== */

        #double-pendulum-controls {

            width: 100% !important;

            max-width: 100% !important;

            margin: 20px auto !important;
        }

    </style>

</head>

<body>

    <div class="simulation-container">

        <canvas
            id="doublePendulumCanvas"
            width="1200"
            height="550">
        </canvas>

    </div>

    <script src="DoublePendulum.js"></script>

    <script>

        const canvas =
            document.getElementById(
                "doublePendulumCanvas"
            );

        const pendulum =
            new DoublePendulum(
                canvas,
                {
                    g: 9.81,

                    L1: 1.0,
                    L2: 1.0,

                    m1: 1.0,
                    m2: 1.0,

                    theta10: 0.8,
                    omega10: 0.0,

                    theta20: 1.2,
                    omega20: 0.0
                }
            );

    </script>

</body>

</html>
