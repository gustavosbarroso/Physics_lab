<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Simulador RLC</title>


    <style>

        body {

            margin: 0;
            padding: 30px;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

        }


        .container {

            max-width: 900px;
            margin: auto;

        }


        h1 {

            margin-bottom: 25px;

        }


        .controls {

            background: white;

            border: 1px solid #ccc;

            border-radius: 8px;

            padding: 20px;

            margin-bottom: 25px;

        }


        .control {

            display: grid;

            grid-template-columns:
                100px
                1fr
                80px;

            align-items: center;

            gap: 15px;

            margin-bottom: 15px;

        }


        .control label {

            font-weight: bold;

        }


        .control input[type="range"] {

            width: 100%;

        }


        .value {

            text-align: right;

            font-family: monospace;

            font-size: 16px;

        }


        .buttons {

            display: flex;

            gap: 10px;

            margin-top: 20px;

        }


        button {

            padding: 10px 20px;

            border: 1px solid #aaa;

            border-radius: 5px;

            background: white;

            cursor: pointer;

            font-size: 15px;

        }


        button:hover {

            background: #eee;

        }


        #canvas {

            display: block;

            background: white;

            border: 1px solid #ccc;

            max-width: 100%;

            height: auto;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>Simulador de Circuito RLC</h1>


    <!-- =================================================
         CONTROLES
         ================================================= -->

    <div class="controls">


        <!-- R -->

        <div class="control">

            <label for="R">
                R (Ω)
            </label>

            <input
                type="range"
                id="R"
                min="0"
                max="20"
                step="0.1"
                value="2"
            >

            <span
                class="value"
                id="R_value">
                2.0
            </span>

        </div>


        <!-- L -->

        <div class="control">

            <label for="L">
                L (H)
            </label>

            <input
                type="range"
                id="L"
                min="0.1"
                max="10"
                step="0.1"
                value="1"
            >

            <span
                class="value"
                id="L_value">
                1.0
            </span>

        </div>


        <!-- C -->

        <div class="control">

            <label for="C">
                C (F)
            </label>

            <input
                type="range"
                id="C"
                min="0.1"
                max="10"
                step="0.1"
                value="1"
            >

            <span
                class="value"
                id="C_value">
                1.0
            </span>

        </div>


        <!-- V0 -->

        <div class="control">

            <label for="V0">
                V₀ (V)
            </label>

            <input
                type="range"
                id="V0"
                min="0"
                max="20"
                step="0.1"
                value="5"
            >

            <span
                class="value"
                id="V0_value">
                5.0
            </span>

        </div>


        <!-- omega -->

        <div class="control">

            <label for="omega">
                ω (rad/s)
            </label>

            <input
                type="range"
                id="omega"
                min="0"
                max="10"
                step="0.1"
                value="2"
            >

            <span
                class="value"
                id="omega_value">
                2.0
            </span>

        </div>


        <div class="buttons">

            <button id="start">
                ▶ Iniciar
            </button>

            <button id="stop">
                ⏸ Parar
            </button>

            <button id="reset">
                ↻ Reiniciar
            </button>

        </div>


    </div>


    <!-- =================================================
         CANVAS
         ================================================= -->

    <canvas
        id="canvas"
        width="700"
        height="750">
    </canvas>


</div>


<script src="./RLC.js"></script>

<script src="./Init_RLC.js"></script>


</body>

</html>
