<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Simulador RLC</title>

    <style>

        body {
            margin: 0;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 1250px;
            margin: 25px auto;
            background: white;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        #canvas {
            width: 100%;
            height: auto;
            border: 1px solid #ccc;
            display: block;
        }

        #controls {
            margin-top: 20px;
            padding: 10px 40px 20px 40px;
        }

        .slider-row {
            display: grid;
            grid-template-columns: 100px 1fr 70px;
            align-items: center;
            gap: 15px;
            margin: 12px 0;
        }

        .slider-label {
            font-size: 15px;
            text-align: right;
        }

        .rlc-slider {
            width: 100%;
        }

        .slider-value {
            font-size: 15px;
            text-align: left;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Circuito RLC</h1>

    <canvas
        id="canvas"
        width="1250"
        height="650">
    </canvas>

    <div id="controls"></div>

</div>


<script src="./RLC.js"></script>

<script>

    const canvas =
        document.getElementById("canvas");

    const circuito =
        new RLCircuit(
            canvas,
            {
                R: 2,
                L: 1,
                C: 1,

                q0: 0,
                i0: 0,

                V0: 5,
                omega: 2
            }
        );

</script>

</body>

</html>
