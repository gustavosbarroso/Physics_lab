<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Efeito Fotoelétrico</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .scene {
            width: 100%;
            aspect-ratio: 1200 / 420;
            min-height: 250px;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .graph {
            width: 100%;
            height: 155px;
            margin-top: 4px;
        }

        .controls {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control {
            display: grid;
            grid-template-columns: 190px minmax(80px, 1fr) 48px;
            align-items: center;
            gap: 14px;
        }

        .control label {
            text-align: right;
            font-size: 14px;
        }

        .control input[type="range"] {
            width: 100%;
            margin: 0;
            cursor: pointer;
            accent-color: #287db5;
        }

        .value {
            font-size: 14px;
            text-align: left;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 650px) {
            body {
                padding: 8px;
            }

            .scene {
                min-height: 210px;
            }

            .graph {
                height: 145px;
            }

            .control {
                grid-template-columns: 125px minmax(50px, 1fr) 35px;
                gap: 7px;
            }

            .control label,
            .value {
                font-size: 11px;
            }

            .controls {
                gap: 19px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <!-- Cena física: a superfície metálica fica nesta região -->
        <section class="scene">
            <canvas id="sceneCanvas" width="1200" height="420"></canvas>
        </section>

        <!-- Gráfico abaixo da cena, sem sobreposição com o metal -->
        <section class="graph">
            <canvas id="graphCanvas" width="1200" height="155"></canvas>
        </section>

        <!-- Controles -->
        <section class="controls">

            <div class="control">
                <label for="frequency">
                    Frequência (10¹⁵ Hz)
                </label>

                <input
                    id="frequency"
                    type="range"
                    min="0"
                    max="2.5"
                    step="0.01"
                    value="1.2"
                >

                <span class="value" id="frequencyValue">1.2</span>
            </div>

            <div class="control">
                <label for="workFunction">
                    Função trabalho (eV)
                </label>

                <input
                    id="workFunction"
                    type="range"
                    min="1"
                    max="6"
                    step="0.1"
                    value="4.1"
                >

                <span class="value" id="workFunctionValue">4.1</span>
            </div>

            <div class="control">
                <label for="intensity">
                    Intensidade relativa
                </label>

                <input
                    id="intensity"
                    type="range"
                    min="0"
                    max="10"
                    step="0.1"
                    value="5"
                >

                <span class="value" id="intensityValue">5</span>
            </div>

        </section>
    </main>

    <script src="EfeitoFotoeletrico.js"></script>
</body>
</html>
