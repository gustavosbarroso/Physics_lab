<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plano Inclinado com Atrito</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;

            background: #f5f5f5;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #222;
        }

        .simulation-container {

            width: min(
                1200px,
                95vw
            );

            margin: 0 auto;

            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.08);
        }

        .canvas-wrapper {

            width: 100%;

            overflow-x: auto;
        }

        #inclinedPlaneFrictionCanvas {

            display: block;

            width: 1200px;
            height: 550px;

            max-width: none;

            background: white;
        }

        .controls {

            margin-top: 18px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            padding: 14px 4px 4px;
        }

        .control-group {

            display: flex;

            flex-direction: column;

            gap: 7px;
        }

        .control-title {

            display: flex;

            justify-content: space-between;

            align-items: center;

            font-size: 14px;

            color: #333;
        }

        .control-value {

            font-weight: bold;

            min-width: 55px;

            text-align: right;
        }

        input[type="range"] {

            width: 100%;

            cursor: pointer;
        }

        @media (max-width: 700px) {

            .simulation-container {
                padding: 10px;
            }

            .controls {

                grid-template-columns: 1fr;

                gap: 10px;
            }
        }

    </style>

</head>

<body>

    <div class="simulation-container">

        <div class="canvas-wrapper">

            <canvas
                id="inclinedPlaneFrictionCanvas"
                width="1200"
                height="550">
            </canvas>

        </div>

        <div
            id="inclinedPlaneFrictionControls"
            class="controls">
        </div>

    </div>

    <script src="plano_inclinado_atrito.js"></script>

</body>

</html>
