<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Circuito RC</title>

    <style>

        body {

            margin: 0;
            padding: 20px;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        h1 {

            margin-bottom: 15px;
        }


        #controls {

            width: 900px;
            max-width: 95vw;

            background: white;

            padding: 15px 20px;

            border-radius: 8px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.12);

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            box-sizing: border-box;

            margin-bottom: 20px;
        }


        .control {

            display: flex;

            flex-direction: column;

            gap: 6px;
        }


        .control label {

            font-weight: bold;

            font-size: 14px;
        }


        .control input[type="range"] {

            width: 100%;
        }


        .value {

            font-size: 14px;

            color: #333;
        }


        #canvas {

            background: white;

            border: 1px solid #ccc;

            display: block;

            max-width: 95vw;

            height: auto;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.10);
        }


        @media (max-width: 800px) {

            #controls {

                grid-template-columns:
                    repeat(2, 1fr);
            }
        }


        @media (max-width: 500px) {

            #controls {

                grid-template-columns:
                    1fr;
            }
        }

    </style>

</head>


<body>

    <h1>
        Circuito RC com fonte contínua
    </h1>


    <!-- =====================================================
         CONTROLES
         ===================================================== -->

    <div id="controls">


        <!-- RESISTÊNCIA -->

        <div class="control">

            <label for="sliderR">
                Resistência R
            </label>

            <input
                type="range"
                id="sliderR"
                min="0.1"
                max="10"
                step="0.1"
                value="2.0"
            >

            <span class="value">

                <span id="valueR">
                    2.0
                </span>

                Ω

            </span>

        </div>


        <!-- CAPACITÂNCIA -->

        <div class="control">

            <label for="sliderC">
                Capacitância C
            </label>

            <input
                type="range"
                id="sliderC"
                min="0.1"
                max="10"
                step="0.1"
                value="1.0"
            >

            <span class="value">

                <span id="valueC">
                    1.0
                </span>

                F

            </span>

        </div>


        <!-- CARGA INICIAL -->

        <div class="control">

            <label for="sliderQ0">
                Carga inicial q₀
            </label>

            <input
                type="range"
                id="sliderQ0"
                min="0"
                max="10"
                step="0.1"
                value="0.0"
            >

            <span class="value">

                <span id="valueQ0">
                    0.0
                </span>

                C

            </span>

        </div>


        <!-- FONTE -->

        <div class="control">

            <label for="sliderV0">
                Fonte V₀
            </label>

            <input
                type="range"
                id="sliderV0"
                min="0"
                max="10"
                step="0.1"
                value="1.0"
            >

            <span class="value">

                <span id="valueV0">
                    1.0
                </span>

                V

            </span>

        </div>

    </div>


    <!-- =====================================================
         CANVAS
         ===================================================== -->

    <canvas
        id="canvas"
        width="900"
        height="430">
    </canvas>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="rc.js"></script>

</body>

</html>
