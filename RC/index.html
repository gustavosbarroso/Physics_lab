<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Circuito RC</title>

</head>


<body>

    <h1>Circuito RC</h1>


    <canvas
        id="canvas"
        width="900"
        height="420">
    </canvas>


    <br><br>


    <label>
        R (Ω):
    </label>

    <input
        id="sliderR"
        type="range"
        min="0.1"
        max="10"
        step="0.1"
        value="2">

    <span id="valueR">2.0</span>


    <br><br>


    <label>
        C (F):
    </label>

    <input
        id="sliderC"
        type="range"
        min="0.1"
        max="5"
        step="0.1"
        value="1">

    <span id="valueC">1.0</span>


    <br><br>


    <label>
        q₀ (C):
    </label>

    <input
        id="sliderQ0"
        type="range"
        min="-2"
        max="2"
        step="0.1"
        value="1">

    <span id="valueQ0">1.0</span>


    <script src="RC.js"></script>

</body>

</html>
